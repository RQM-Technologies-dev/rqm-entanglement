[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rqm-entanglement"
version = "0.2.0"
description = "Two-qubit / nonlocal layer of the RQM quantum stack."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "rqm-core @ git+https://github.com/RQM-Technologies-dev/rqm-core.git@f3a9988871e4f9f44c85a2b0ac726014ada3b58b",
]

[project.optional-dependencies]
qiskit = [
    "qiskit>=2.3,<2.4",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.8",
    "qiskit>=2.3,<2.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
